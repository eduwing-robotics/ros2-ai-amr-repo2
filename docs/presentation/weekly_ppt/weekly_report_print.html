<!doctype html>
<!-- opencode: 2026-06-28 - URHYNIX 1주 진행상황 발표 PPT (코드 트레이스+Confluence/Jira 연동).

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>UR HYNIX · 1주 진행상황 (2026-06-22 ~ 06-28)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#004737; --mint:#56F09F; --mint-soft:#a8e8c8; --paper:#f0f6f3;
  --line:#c8d8d0; --line-strong:#7fae9a; --ink:#0d1f17; --sub:#44614f;
  --bg:#eef4ef; --warn:#d97706; --bad:#b91c1c; --ok:#15803d;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a1510;color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.55;overflow:hidden}
code,pre{font-family:'JetBrains Mono',ui-monospace,monospace}

/* 슬라이드 박스: 16:9 (1280x720) */
.deck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:2000px}
.slide{
  width:min(96vw,1280px);height:min(calc(54vw),720px);
  background:var(--bg);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(86,240,159,.18);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
.slide::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 500px at 90% -10%,rgba(86,240,159,.08),transparent 60%),
  radial-gradient(600px 400px at -10% 110%,rgba(0,71,55,.10),transparent 60%);
  pointer-events:none}

/* 상단 바 */
.top{height:46px;flex-shrink:0;background:linear-gradient(90deg,var(--brand),#0a5b46);display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#d9f5e8;position:relative;z-index:2}
.top .brand{font-weight:700;letter-spacing:.02em;font-size:13px;display:flex;align-items:center;gap:10px}
.top .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(86,240,159,.25)}
.top .pager{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mint-soft);opacity:.85}
.top .date{font-size:11px;color:var(--mint-soft);opacity:.7}

/* 본문 */
.body{flex:1;overflow:hidden;padding:6px 14px 4px;position:relative;z-index:1}
.foot{height:30px;flex-shrink:0;border-top:1px solid #dbe7e0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:10px;color:#6b8a7d;background:#f6faf8}
.foot .key{font-family:'JetBrains Mono',monospace}
.foot .key b{color:var(--brand);background:#e0ece6;border-radius:3px;padding:1px 6px;margin:0 2px}

/* 공통 */
.kicker{display:inline-block;background:var(--brand);color:var(--mint);font-size:10px;font-weight:700;letter-spacing:.12em;padding:2px 10px;border-radius:14px;margin-bottom:3px}
.title{font-size:24px;font-weight:900;color:var(--brand);letter-spacing:-.02em;line-height:1.15;margin-bottom:2px}
.title .em{color:#0fa560}
.subtitle{font-size:13px;color:var(--sub);margin-bottom:10px;max-width:90%}
.divider{height:3px;width:48px;background:var(--mint);border-radius:2px;margin:0 0 5px}

/* nav */
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:99;background:rgba(10,21,16,.85);padding:8px 14px;border-radius:24px;border:1px solid rgba(86,240,159,.3);backdrop-filter:blur(8px)}
.nav button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:#9fe7c8;cursor:pointer;font-size:14px;transition:.15s}
.nav button:hover{background:var(--mint);color:var(--brand)}
.nav .pos{color:var(--mint);font-family:'JetBrains Mono',monospace;font-size:11px;min-width:54px;text-align:center}
.nav .home{width:auto;padding:0 10px;border-radius:14px}

/* 공통 그리드/카드 */
.grid{display:grid;gap:8px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.grid-4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.card.dark{background:#0c2a22;color:#d6f5e6;border-color:#1d5546}
.card .h{font-size:14px;font-weight:700;color:var(--brand);margin-bottom:2px}
.card .h.num{display:flex;align-items:baseline;gap:8px}
.card .h .n{font-size:26px;color:var(--mint);font-weight:900}
.card .b{font-size:13px;color:#354c41}
.tag{display:inline-block;background:#e8f5ee;color:var(--brand);border:1px solid #b8dece;border-radius:10px;padding:1px 8px;font-size:10px;font-weight:600;margin:2px 3px 2px 0}
.badge{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.04em}
.badge.ok{background:#dcfce7;color:var(--ok)}
.badge.warn{background:#fef3c7;color:var(--warn)}
.badge.bad{background:#fee2e2;color:var(--bad)}
.badge.doing{background:#dbeafe;color:#1d4ed8}
.badge.todo{background:#f3f4f6;color:#475569}
.badge.q{background:#fef9c3;color:#854d0e}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--paper);color:var(--brand);font-weight:700}
td .mono{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#0a6b4d}
.tnum{font-family:'JetBrains Mono',monospace;color:var(--brand);font-weight:700}

/* 타임라인 */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:0;width:2px;background:linear-gradient(180deg,var(--mint),transparent)}
.tl{display:grid;grid-template-columns:60px 1fr;gap:14px;margin-bottom:8px;position:relative}
.tl::before{content:"";position:absolute;left:-22px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--bg)}
.tl .day{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--brand);text-transform:uppercase}
.tl .body-row{font-size:11.5px;color:#354c41}
.tl .body-row b{color:#0a3c2d;font-weight:700}

/* 코드 트레이스 */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:stretch}
.flow .step{background:#0c2a22;border-radius:6px;padding:8px 10px;color:#d6f5e6;font-size:10.5px;position:relative;border:1px solid #1d5546}
.flow .step .stage{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--mint);font-weight:700;letter-spacing:.08em;display:block;margin-bottom:4px}
.flow .step .name{font-weight:700;color:#fff;font-size:11px;display:block;margin-bottom:4px}
.flow .step code{font-size:9.5px;color:var(--mint-soft);white-space:pre-wrap;display:block;line-height:1.4}
.flow .step::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--mint);font-weight:700;z-index:1}
.flow .step:last-child::after{display:none}
.flow .step.src{background:#0a3c2d}
.flow .step.api{background:#2a1d0c;border-color:#5a3e1c}
.flow .step.api code{color:#fcd9a8}
.flow .step.ros{background:#1a1030;border-color:#3d2a5a}
.flow .step.ros code{color:#c9b8f5}
.flow .step.db{background:#0c2230;border-color:#1d4555}
.flow .step.db code{color:#a8d8f5}
.flow .step.unity{background:#1a2810;border-color:#3a5a2a}
.flow .step.unity code{color:#c8f5a8}

/* 이미지 박스 */
.img-box{position:relative;background:#0c2a22;border-radius:8px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.img-box img{width:100%;height:100%;object-fit:cover;display:block;border-radius:8px}
.img-box.full img{object-fit:contain;background:#fff}
.img-box .cap{position:absolute;left:8px;bottom:8px;background:rgba(0,71,55,.88);color:var(--mint);font-size:9.5px;padding:3px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace}
.img-box .tag-pos{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.5);color:#fff;font-size:9px;padding:2px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace}

.image-grid{display:grid;gap:8px}
.image-grid.g2{grid-template-columns:1fr 1fr}
.image-grid.g3{grid-template-columns:repeat(3,1fr)}
.image-grid.g4{grid-template-columns:repeat(4,1fr)}
.image-grid .img-box{height:180px}
.image-grid.g4 .img-box{height:140px}

/* 진행률 바 */
.bar{height:6px;background:#e0ece6;border-radius:3px;overflow:hidden}
.bar .f{height:100%;background:linear-gradient(90deg,var(--mint),#0fa560);border-radius:3px}

/* 점수판 */
.scoreline{display:flex;gap:14px;margin-bottom:12px;align-items:stretch}
.scoreline .stat{flex:1;border-left:3px solid var(--mint);padding:2px 14px}
.scoreline .stat .v{font-size:32px;font-weight:900;color:var(--brand);line-height:1.05;font-family:'JetBrains Mono',monospace}
.scoreline .stat .l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

/* hidden / visible */
.slide[hidden]{display:none}

/* help 토글 */
.help{position:fixed;top:14px;right:14px;z-index:99;background:rgba(10,21,16,.85);color:var(--mint);border:1px solid rgba(86,240,159,.3);padding:6px 10px;border-radius:14px;font-size:10px;font-family:'JetBrains Mono',monospace;cursor:pointer;backdrop-filter:blur(8px)}

@media print {
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{overflow:visible;height:auto;background:#fff;margin:0;padding:0}
  .deck{position:static;display:block;padding:0;margin:0}
  .slide{
    width:1280px;height:720px;
    page-break-after:always;break-after:page;
    margin:0;padding:0;border-radius:0;box-shadow:none;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .nav,.help{display:none !important}
}
body.print-mode{overflow-y:auto;background:#fff;margin:0;padding:0}
body.print-mode .deck{position:static;display:block;margin:0;padding:0}
body.print-mode .slide{
  width:1280px;height:720px;
  margin:0;padding:0;
  border-radius:0;box-shadow:none;
  display:flex;flex-direction:column;
  overflow:hidden;
  page-break-after:always;break-after:page;
}
body.print-mode .nav,
body.print-mode .help{display:none !important}
</style>
</head>
<body>
<div class="help" onclick="alert('Space/→/PgDn 다음 · ←/PgUp/Back 이전 · Home 첫 슬라이드 · F 풀스크린')">?</div>

<div id="deck" class="deck"></div>

<div class="nav">
  <button class="home" onclick="go(0)" title="처음">⌂</button>
  <button onclick="prev()" title="이전">‹</button>
  <span class="pos" id="pos">1/1</span>
  <button onclick="next()" title="다음">›</button>
  <button onclick="document.documentElement.requestFullscreen()" title="전체화면">⛶</button>
</div>

<script id="slides" type="application/json">
데이터는 아래 본 스크립트에서 정의합니다 (JSON 내 `<` 충돌 회피)

<script>
// opencode: 슬라이드 데이터 + 렌더러. 각 슬라이드는 {t:title, k:kicker, b:bodyHTML} 로 구성.
const SLIDES = [];

// 공통 렌더: 상단/본문/하단 프레임 + 본문 문자열 삽입
function frame(idx, total, date, bodyHTML){
  return `<div class="slide" id="slide">
    <div class="top">
      <div class="brand"><span class="dot"></span>UR HYNIX · 디지털트윈경비로봇 — 1주 진행상황</div>
      <div class="pager">${String(idx+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</div>
      <div class="date">${date}</div>
    </div>
    <div class="body">${bodyHTML}</div>
    <div class="foot">
      <div>박물관·미술관 액자형 전시품 보호 · Unity ControlRoom · ROS2 Domain 210 · Supabase</div>
      <div class="key"><b>→</b>다음 <b>←</b>이전 <b>F</b>전체화면</div>
    </div>
  </div>`;
}

const DATE_LABEL = '2026-06-22 ~ 06-28';

// ───────────────────────── 슬라이드 6: 소프트웨어 아키텍처 ─────────────────────────
SLIDES.push(`
  <div class="kicker">01 · 소프트웨어 아키텍처</div>
  <div class="title">클릭 → <span class="em">명령 전달</span> → 로봇 출발 → <span class="em">기록 저장</span> → 화면 갱신</div>
  <div class="divider"></div>
  <div style="display:flex;flex-direction:column;gap:8px;height:calc(100% - 60px)">
    <!-- 상단: Unity ↔ ROS2 ↔ 로봇 -->
    <div style="display:flex;align-items:stretch;gap:0;flex:1.2">
      <!-- Unity -->
      <div style="background:#1a2810;border:3px solid #56F09F;border-radius:14px;padding:14px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:190px">
        <div style="font-size:10px;color:#56F09F;font-weight:700;letter-spacing:.1em;margin-bottom:4px">관제실 PC</div>
        <div style="font-size:32px;font-weight:900;color:#fff;line-height:1">Unity</div>
        <div style="font-size:12px;color:#bfe6d3;margin-top:6px;text-align:center;line-height:1.4">지도·버튼 조작<br>로봇 상태 모니터링</div>
      </div>
      <!-- 화살표 1 -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;min-width:90px">
        <div style="font-size:11px;color:#aaa;margin-bottom:3px">포트 10000</div>
        <div style="font-size:36px;color:#56F09F;line-height:1">⟷</div>
        <div style="font-size:11px;color:#aaa;margin-top:3px">명령·데이터</div>
      </div>
      <!-- ROS2 -->
      <div style="background:#1a1030;border:3px solid #c9b8f5;border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1">
        <div style="font-size:10px;color:#c9b8f5;font-weight:700;letter-spacing:.1em;margin-bottom:4px">무선 통신 네트워크</div>
        <div style="font-size:32px;font-weight:900;color:#fff;line-height:1">ROS2</div>
        <div style="font-size:12px;color:#c9b8f5;margin-top:6px;text-align:center;line-height:1.4">로봇·관제실이 공유하는<br>같은 채널(Domain 210)</div>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;min-width:60px">
        <div style="font-size:36px;color:#56F09F;line-height:1">⟷</div>
      </div>
      <!-- 로봇 2대 -->
      <div style="display:flex;flex-direction:column;gap:8px;min-width:210px">
        <div style="background:#2a1d0c;border:2.5px solid #fcd9a8;border-radius:12px;padding:12px 16px;flex:1;display:flex;flex-direction:column;justify-content:center">
          <div style="font-size:13px;font-weight:900;color:#fcd9a8;margin-bottom:3px">티원 로봇</div>
          <div style="font-size:12px;color:#e8c8a0;line-height:1.45">RGB-D 카메라로 공간 촬영<br>3D 지도 생성 담당</div>
        </div>
        <div style="background:#0c2230;border:2.5px solid #a8d8f5;border-radius:12px;padding:12px 16px;flex:1;display:flex;flex-direction:column;justify-content:center">
          <div style="font-size:13px;font-weight:900;color:#a8d8f5;margin-bottom:3px">젠지 로봇</div>
          <div style="font-size:12px;color:#90c8e8;line-height:1.45">온도·소음·PIR·레이저<br>센서 4종 + 순찰 담당</div>
        </div>
      </div>
    </div>
    <!-- 아래 화살표 -->
    <div style="text-align:center;font-size:15px;font-weight:700;color:#56F09F;letter-spacing:.05em">↓ &nbsp; 모든 사건·위치·명령이 자동으로 기록됩니다 &nbsp; ↓</div>

        <div style="font-size:10px;color:#56F09F;font-weight:700;letter-spacing:.1em;margin-bottom:4px">클라우드 데이터베이스</div>

      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1">
        <div style="background:#1a2810;border:1px solid #56F09F;border-radius:8px;padding:6px 14px;text-align:center">
          <div style="font-size:10px;color:#56F09F">출동 명령</div>
          <div style="font-size:13px;font-weight:700;color:#fff">dispatches</div>
        </div>

          <div style="font-size:10px;color:#fcd9a8">센서 감지</div>
          <div style="font-size:13px;font-weight:700;color:#fff">events</div>
        </div>
        <div style="background:#0c2230;border:1px solid #a8d8f5;border-radius:8px;padding:6px 14px;text-align:center">

        </div>

          <div style="font-size:13px;font-weight:700;color:#fff">camera_captures</div>
        </div>

  </div>

// ───────────────────────── 슬라이드 7: 관제실 전체 개요 ─────────────────────────
SLIDES.push(`
  <div class="kicker">02 · Unity 관제실 — 전체 화면</div>
  <div class="title">화면 각 구역이 <span class="em">어떤 DB 테이블로</span> 연결되나</div>
  <div class="divider"></div>
  <div class="grid grid-2" style="gap:14px;align-items:start">
    <div style="position:relative;height:330px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f0f6f3">
      <img src="assets/img/live_map.png" style="width:100%;height:100%;object-fit:contain;object-position:top center;display:block">
      <div style="position:absolute;top:28%;left:0%;background:rgba(0,71,55,.93);color:var(--mint);font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:0 3px 3px 0;border:1px solid var(--mint);border-left:0;white-space:nowrap">① 버튼 → logs</div>
      <div style="position:absolute;top:46%;left:38%;background:rgba(0,71,55,.93);color:var(--mint);font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:3px;border:1px solid var(--mint);white-space:nowrap">② 로봇 마커 → pose_logs</div>
