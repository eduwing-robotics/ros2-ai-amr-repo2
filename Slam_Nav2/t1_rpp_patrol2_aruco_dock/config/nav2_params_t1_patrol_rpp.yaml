amcl:
  ros__parameters:
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 0.7
    laser_max_range: 2.3
    laser_min_range: 0.12
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 1200
    min_particles: 300
    odom_frame_id: odom
    pf_err: 0.02
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 1.0
    sigma_hit: 0.12
    tf_broadcast: true
    transform_tolerance: 2.0
    update_min_a: 0.03
    update_min_d: 0.03
    z_hit: 0.75
    z_max: 0.05
    z_rand: 0.15
    z_short: 0.05
    scan_topic: /scan
    map_topic: map
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 2.0
    filter_duration: 0.3
    default_nav_to_pose_bt_xml: BEHAVIOR_TREE_NAV_TO_POSE
    default_nav_through_poses_bt_xml: BEHAVIOR_TREE_NAV_THROUGH
    always_reload_bt_xml: false
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.15
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.6
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.02
      movement_time_allowance: 45.0
    goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.09
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.32
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.50
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.85
      transform_tolerance: 2.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.07
      approach_velocity_scaling_dist: 0.2
      # Collision Monitor retains the final 5 cm emergency stop.
      use_collision_detection: false
      # FrontStop handles the final 5 cm emergency stop. Keep RPP prediction
      # short enough to avoid stop/go oscillation in the narrow map.
      max_allowed_time_to_collision_up_to_carrot: 0.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.12
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 22.0
      regulated_linear_scaling_min_radius: 0.25
      regulated_linear_scaling_min_speed: 0.07
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.8
      allow_reversing: false
      stateful: true
      use_interpolation: true
    enable_stamped_cmd_vel: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 12.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 2.0
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.02
      footprint: '[[-0.09, -0.09], [-0.09, 0.09], [0.09, 0.09], [0.09, -0.09]]'
      footprint_padding: 0.005
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.14
        cost_scaling_factor: 22.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 2.0
          raytrace_min_range: 0.12
          obstacle_max_range: 1.5
          obstacle_min_range: 0.12
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: true
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 2.0
      initial_transform_timeout: 300.0
      footprint: '[[-0.09, -0.09], [-0.09, 0.09], [0.09, 0.09], [0.09, -0.09]]'
      footprint_padding: 0.005
      resolution: 0.02
      track_unknown_space: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        transform_tolerance: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.14
        cost_scaling_factor: 26.0
      always_send_full_costmap: true
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.15
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 2500
      max_on_approach_iterations: 100
      cost_travel_multiplier: 4.0
      use_final_approach_orientation: false
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 150
      do_refinement: false
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    - assisted_teleop
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_timeout: 2.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.25
    rotational_acc_lim: 2.0
    enable_stamped_cmd_vel: true
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.18
    - 0.0
    - 1.0
    min_velocity:
    - -0.06
    - 0.0
    - -1.0
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
    max_accel:
    - 0.5
    - 0.0
    - 1.5
    max_decel:
    - -0.7
    - 0.0
    - -1.8
    odom_topic: odom
    odom_duration: 0.1
    use_realtime_priority: false
    enable_stamped_cmd_vel: true
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 2.0
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: true
    use_realtime_priority: false
    polygons:
    - FrontStop
    - FrontSlow
    FrontStop:
      type: polygon
      points: '[[0.14, 0.08], [0.14, -0.08], [0.09, -0.08], [0.09, 0.08]]'
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: front_stop
      enabled: true
    observation_sources:
    - scan
    scan:
      source_timeout: 5.0
      type: scan
      topic: /scan
      enabled: true
    FrontSlow:
      type: polygon
      points: '[[0.24, 0.10], [0.24, -0.10], [0.09, -0.10], [0.09, 0.10]]'
      action_type: slowdown
      slowdown_ratio: 0.55
      min_points: 3
      visualize: true
      polygon_pub_topic: front_slow
      enabled: true
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins:
    - simple_charging_dock
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    docks: []
