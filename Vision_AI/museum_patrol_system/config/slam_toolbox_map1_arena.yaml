# 1.8m × 1.8m arena (30cm walls) — T1 LDS-03 + slam_toolbox online_async.
# SSOT: start_t1_mapping.sh / _t1_slam_live.sh 가 이 파일을 로봇에 복사해 사용.
# 1.8m 대각선 ≈ 2.55m → max_laser_range 2.3m 로 외부 노이즈 차단.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_fixed
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 0.5
    resolution: 0.02
    min_laser_range: 0.25
    max_laser_range: 2.3
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 2.3
    link_match_minimum_response_fine: 0.12
    link_scan_maximum_distance: 0.8
    loop_search_maximum_distance: 1.2
    do_loop_closing: true
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 2.0
    loop_match_minimum_response_coarse: 0.4
    loop_match_minimum_response_fine: 0.5

    correlation_search_space_dimension: 0.25
    correlation_search_space_resolution: 0.005
    correlation_search_space_smear_deviation: 0.05
    loop_search_space_dimension: 2.0
    loop_search_space_resolution: 0.02
    loop_search_space_smear_deviation: 0.02

    distance_variance_penalty: 0.4
    angle_variance_penalty: 0.8
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.25
    coarse_angle_resolution: 0.025
    minimum_angle_penalty: 0.85
    minimum_distance_penalty: 0.4
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
