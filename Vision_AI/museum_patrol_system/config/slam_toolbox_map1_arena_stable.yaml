# 1.8m arena — pose jump / false loop-closure 완화용 (Gen.G 매핑)
# 기본 map1_arena.yaml 대비: loop closing OFF, scan match 임계값 상향, 이동 최소량 증가
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_fixed
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 0.5
    resolution: 0.02
    min_laser_range: 0.25
    max_laser_range: 2.3
    minimum_time_interval: 0.25
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 2.3
    link_match_minimum_response_fine: 0.20
    link_scan_maximum_distance: 0.7
    loop_search_maximum_distance: 0.8
    do_loop_closing: false
    loop_match_minimum_chain_size: 12
    loop_match_maximum_variance_coarse: 1.5
    loop_match_minimum_response_coarse: 0.55
    loop_match_minimum_response_fine: 0.65

    correlation_search_space_dimension: 0.20
    correlation_search_space_resolution: 0.005
    correlation_search_space_smear_deviation: 0.04
    loop_search_space_dimension: 1.5
    loop_search_space_resolution: 0.02
    loop_search_space_smear_deviation: 0.02

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.20
    coarse_angle_resolution: 0.020
    minimum_angle_penalty: 0.90
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
